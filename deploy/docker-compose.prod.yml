# Боевой запуск на публичном сервере: сайт, API, база, HTTPS и ежедневные резервные копии.
#
# Запуск (из корня проекта):
#   cp deploy/.env.example deploy/.env      # затем заполнить, см. deploy/README.md
#   ./deploy/check-env.sh                   # проверка настроек
#   ./deploy/deploy.sh                      # сборка и запуск
#
# Наружу открыты только порты 80 и 443 у Caddy. База, backend и frontend доступны лишь внутри Docker.
name: nutrition-prod

services:
  # --- База данных: данные в томе db_data, порты наружу не публикуются ---
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_DB: nutrition
      TZ: ${TZ:-UTC}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- API: применяет миграции и запускает сервер; снаружи недоступен, только через Caddy ---
  backend:
    build: ../backend
    image: nutrition-backend:1.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Режим production включает строгую проверку настроек: слабый ключ или http-адрес остановят запуск
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://nutrition:${POSTGRES_PASSWORD}@db:5432/nutrition
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Укажите JWT_SECRET_KEY в deploy/.env}
      CORS_ORIGINS: https://${DOMAIN:?Укажите DOMAIN в deploy/.env}
      # Допустимые значения Host: домен сайта и адреса для проверки здоровья внутри контейнера
      ALLOWED_HOSTS: ${DOMAIN},localhost,127.0.0.1
      # Реальный адрес посетителя приходит от Caddy в X-Forwarded-For; backend недоступен в обход Caddy, поэтому верить можно
      TRUST_PROXY_HEADERS: "true"
      # Caddy убирает префикс /api, но браузер видит адрес /api/auth/...: cookie сессии привязана к нему
      REFRESH_COOKIE_PATH: /api/auth
      UPLOAD_DIR: /data/uploads
      MAX_PHOTO_MB: ${MAX_PHOTO_MB:-8}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      TZ: ${TZ:-UTC}
    volumes:
      - uploads:/data/uploads
    networks: [edge, data]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # --- Сайт (Next.js): снаружи недоступен, только через Caddy ---
  frontend:
    build:
      context: ../frontend
      args:
        # Сайт и API на одном домене: запросы идут на /api, Caddy передаёт их в backend
        NEXT_PUBLIC_API_URL: /api
    image: nutrition-frontend:1.4
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # --- Веб-сервер: сам получает и продлевает бесплатный сертификат Let's Encrypt ---
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Укажите ACME_EMAIL в deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # сертификаты: не удалять, у Let's Encrypt есть лимиты на выпуск
      - caddy_config:/config
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  # --- Ежедневные резервные копии базы и фото (см. deploy/BACKUP.md) ---
  backup:
    image: postgres:16
    restart: unless-stopped
    # Тот же пользователь, что у backend: ему доступны файлы в томе с фото
    user: "10001:10001"
    entrypoint: ["/bin/bash", "/backup/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: nutrition
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: nutrition
      TZ: ${TZ:-UTC}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      KEEP_DAILY_DAYS: ${KEEP_DAILY_DAYS:-14}
      KEEP_MONTHLY_MONTHS: ${KEEP_MONTHLY_MONTHS:-6}
    volumes:
      - ./backup:/backup:ro
      - uploads:/data/uploads:ro
      # Папка на сервере, куда падают копии. Создать: sudo install -d -o 10001 -g 10001 -m 750 /var/backups/nutrition
      - ${BACKUP_DIR:-/var/backups/nutrition}:/backups
    networks: [data]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Здоров, если свежая копия базы (младше 26 часов) есть; иначе в `docker compose ps` будет unhealthy
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'nutrition-db-*.dump' -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 10m

networks:
  # edge: сайт и входящий трафик; data: база. Caddy и сайт до базы добраться не могут
  edge:
  data:

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
