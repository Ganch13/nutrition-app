<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5fb" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <title>Нет соединения — Лад</title>
    <style>
      /* Эта страница показывается без интернета, поэтому все стили и значок записаны прямо в ней */
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f4f5fb;
        color: #1a1e3a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 340px; }
      svg { display: block; width: 72px; height: 72px; margin: 0 auto 24px; }
      h1 { margin: 0 0 8px; font-family: Georgia, "Times New Roman", serif; font-size: 26px; font-weight: 600; }
      p { margin: 0 auto 28px; color: #5c6382; line-height: 1.55; }
      a {
        display: inline-block;
        min-width: 160px;
        padding: 13px 24px;
        border-radius: 14px;
        background: #3640a8;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #7c8ae3; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" role="img" aria-label="Лад">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3c48b5" />
            <stop offset="1" stop-color="#232a74" />
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#g)" />
        <path d="M142 372 C186 372 206 330 220 264 C234 198 244 148 300 148 C346 148 366 164 366 196 V372" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="296" cy="312" r="28" fill="#f2a22e" />
      </svg>
      <h1>Нет соединения</h1>
      <p>Приложению нужен интернет, чтобы показать ваши данные. Проверьте подключение и попробуйте снова.</p>
      <a href="/">Повторить</a>
    </main>
  </body>
</html>
