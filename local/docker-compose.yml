# Локальная проверка перед выкладкой на сервер (пункт 6 ТЗ от 29.10.2026).
#
# Это отдельное окружение со своими настройками и базой. С боевым сервером оно не связано:
#   - имя проекта lad-local: свои контейнеры, тома и сеть, в Docker Desktop это отдельная группа;
#   - настройки берутся только из local/.env (создаётся скриптом lad-local, ключи случайные, не боевые);
#   - порты 3100 и 8100, поэтому можно одновременно держать запущенной разработку (3000/8000);
#   - всё открыто только на этом компьютере (127.0.0.1).
#
# Управление — скриптом, команды описаны в local/README.md:
#   .\local\lad-local.cmd up | seed | reset | down | purge | status | logs
#
# Версия в именах образов и контейнеров (1.4.0) поднимается вместе с версией релиза.

name: lad-local

services:
  db:
    image: postgres:16
    container_name: lad-local-1.4.0-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lad
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?нет local/.env, запустите .\local\lad-local.cmd up}
      POSTGRES_DB: lad_local
    volumes:
      - db:/var/lib/postgresql/data   # отдельный том lad-local_db; reset и purge удаляют его
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lad -d lad_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    image: lad-backend:1.4.0-local
    container_name: lad-local-1.4.0-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://lad:${LOCAL_POSTGRES_PASSWORD}@db:5432/lad_local
      JWT_SECRET_KEY: ${LOCAL_JWT_SECRET_KEY:?нет local/.env, запустите .\local\lad-local.cmd up}
      # development: включён Swagger на http://localhost:8100/docs
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
      TZ: Europe/Moscow
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8100:8000"

  frontend:
    build:
      context: ../frontend
      args:
        # Адрес API вшивается при сборке: браузер ходит на локальный backend
        NEXT_PUBLIC_API_URL: http://localhost:8100
    image: lad-frontend:1.4.0-local
    container_name: lad-local-1.4.0-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  db:
  uploads:
